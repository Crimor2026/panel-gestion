<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reportes ATU</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CSS -->
<link rel="stylesheet" href="/static/reportes/reportes.css">

</head>

<body>

<!-- ================= FONDO ================= -->
<svg class="fondoSVG" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">

  <path class="anim"
    d="M0,900 L0,350 C300,450 700,200 1440,350 L1440,900 Z"
    fill="url(#grad1)" />

  <path class="anim"
    d="M0,900 L0,200 C250,300 500,150 900,250 L0,900 Z"
    fill="url(#grad2)" />

  <defs>
    <linearGradient id="grad1">
      <stop offset="0%" stop-color="#0f4c75"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="grad2">
      <stop offset="0%" stop-color="#0f4c75"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

</svg>

<!-- ================= PARTICULAS ================= -->
<canvas id="particles"></canvas>

<!-- ================= CONTENIDO ================= -->
<div class="container">

    <h1 class="titulo">PANEL DE REPORTES</h1>

    <div class="grid-reportes">

        <div class="card" onclick="irReporte('A')">
            <div>
                <span>Formato A</span>
                <span>RELACIÓN GENERAL DE PROYECTOS</span>
            </div>
        </div>

        <div class="card" onclick="irReporte('B')">
            <div>
                <span>Formato B</span>
                <span>REPORTE EJECUTIVO DE ALTA DIRECCIÓN</span>
            </div>
        </div>

        <div class="card" onclick="irReporte('C')">
            <div>
                <span>Formato C</span>
                <span>FICHA TÉCNICA DEL PROYECTO</span>
            </div>
        </div>

        <div class="card" onclick="irReporte('D')">
            <div>
                <span>Formato D</span>
                <span>REPORTE DE AVANCE DE PROYECTO</span>
            </div>
        </div>

        <div class="card" onclick="irReporte('E')">
            <div>
                <span>Formato E</span>
                <span>PROGRAMACIÓN DE EJECUCIÓN DEL PROYECTO</span>
            </div>
        </div>

        <!-- NUEVO BOTÓN -->
        <div class="card" onclick="irReporte('TEMA')">
            <div>
                <span>Formato Tema</span>
                <span>REPORTE TEMATICO</span>
            </div>
        </div>

        <!-- 🔒 SOLO SI ESTÁ LOGUEADO -->
        <div id="cardLlenado" class="card hidden" onclick="irReporte('LLENADO')">
            <div>
                <span>Formulario</span>
                <span>FORMATO DE LLENADO</span>
            </div>
        </div>

    </div>

</div>

<!-- ================= JS ================= -->

<script>
function irReporte(tipo){

    const rol = sessionStorage.getItem("rol");

    // 🔒 Validar login
    if (!rol) {
        alert("Debes iniciar sesión");
        window.location.href = "/";
        return;
    }

    // NUEVO
    if(tipo === "TEMA"){
        window.location.href = "/reportextema";
        return;
    }

    window.location.href = `/reportes/${tipo}`;
}

function volver(){
    window.location.href = "/";
}

/* 🔐 MOSTRAR FORMULARIO SOLO SI LOGIN */
document.addEventListener("DOMContentLoaded", () => {

    const card = document.getElementById("cardLlenado");
    const rol = sessionStorage.getItem("rol");

    if (rol) {
        card.classList.remove("hidden");
    }

});
</script>

<!-- 🔥 PARTÍCULAS INLINE (MEJOR RENDIMIENTO Y CONTROL) -->
<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let particles = [];

for(let i=0;i<60;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        vx:Math.random()*0.5-0.25,
        vy:Math.random()*0.5-0.25
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;

        if(p.x<0||p.x>canvas.width) p.vx*=-1;
        if(p.y<0||p.y>canvas.height) p.vy*=-1;

        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,0.4)";
        ctx.fill();
    });

    requestAnimationFrame(draw);
}

draw();
</script>

<!-- lógica extra -->
<script src="/static/reportes/reportes.js"></script>

<!-- ================= VOLVER ================= -->

<div class="footer-volver">

    <button id="volverInicio">
        Volver
    </button>

</div>

<script>

document.getElementById("volverInicio")
.onclick = () => {

    window.location.href = "/";

};

</script>

</body>
</html>
