<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Gestión - ATU</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

/* =========================
BASE + DARK/LIGHT
========================= */
:root{
--bg1:#0f4c75;
--bg2:#00a8a8;
--bg3:#38bdf8;
--texto:#0f172a;
}

@media (prefers-color-scheme: dark){
:root{
--bg1:#0b2c3d;
--bg2:#0f766e;
--bg3:#0ea5e9;
--texto:#e5e7eb;
}
}

body{
margin:0;
font-family:sans-serif;
overflow:hidden;
background:var(--bg1);
}

/* =========================
FONDO SVG
========================= */
.fondoSVG{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
object-fit:cover;
pointer-events:none;
}

/* =========================
PARTÍCULAS
========================= */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
pointer-events:none;
}

/* =========================
ANIMACIONES
========================= */
.anim{
animation:float 8s ease-in-out infinite alternate;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-20px);}
}

/* =========================
CONTENIDO
========================= */
.contenedor{
position:relative;
margin-top:80px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
gap:10px;
max-width:900px;
margin-left:auto;
margin-right:auto;
}

/* LOGO GRANDE */
.logo{
width:600px;

filter: 
drop-shadow(0px 10px 25px rgba(0,0,0,0.3))
drop-shadow(0px 0px 15px rgba(0,180,255,0.3));
}

.titulo{
font-size:32px;
font-weight:bold;
line-height:1.2;

text-shadow:
0px 2px 4px rgba(0,0,0,0.25),
0px 8px 20px rgba(0,0,0,0.15);
}

.subtitulo{
margin-top:10px;
font-size:21px;
letter-spacing:1px;
opacity:0.9;
}

/* =========================
BOTONES
========================= */
.botones{
position:absolute;
bottom:60px;
width:100%;
display:flex;
justify-content:center;
gap:25px;
}

.btn{
padding:14px 40px;
border-radius:14px;

background:rgba(15,23,42,0.6);
backdrop-filter:blur(12px);

color:white;
font-weight:500;

border:1px solid rgba(255,255,255,0.25);

box-shadow:
0px 10px 25px rgba(0,0,0,0.4),
0px 0px 20px rgba(0,200,255,0.25);

transition:0.3s;
cursor:pointer;
}

.btn:hover{
transform:translateY(-5px) scale(1.05);
background:linear-gradient(135deg,#00c6ff,#00ffd5);
box-shadow:0px 20px 60px rgba(0,200,255,0.6);
}

/* =========================
LOGIN FLOTANTE
========================= */
.login{
position:relative;
margin:30px auto;
width:280px;

background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);

padding:20px;
border-radius:16px;

box-shadow:0px 10px 30px rgba(0,0,0,0.4);

z-index:2;
}

.input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
}

/* =========================
RESPONSIVE MOVIL
========================= */
@media (max-width:768px){

body{
overflow:auto;
}

/* CONTENIDO */
.contenedor{
position:relative;
margin-top:80px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
gap:10px;
z-index:1;
}

/* LOGO */
.logo{
width:180px;
margin-bottom:5px;
}

/* TEXTO */
.titulo{
font-size:20px;
line-height:1.2;
}

.subtitulo{
font-size:13px;
margin-top:5px;
opacity:0.9;
}

/* LOGIN */
.login{
position:relative;
top:auto;
left:50%;
transform:translateX(-50%);
margin-top:20px;
width:85%;
}

/* BOTONES */
.botones{
position:relative;
bottom:auto;
margin-top:20px;
flex-direction:column;
gap:10px;
padding:0 20px;
}

.btn{
width:100%;
display:inline-block;
text-align:center;
font-weight:500;
letter-spacing:0.5px;
}

}

</style>

</head>

<body>

<div id="popupBienvenida"
style="
position: fixed;
top: 30px;
left: 50%;
transform: translateX(-50%);
background: #e0f2fe;
color: #0f172a;
padding: 20px 30px;
border-radius: 12px;
box-shadow: 0 10px 30px rgba(0,0,0,0.2);
font-size: 14px;
text-align: center;
display: none;
opacity: 0;
transition: opacity 0.5s ease;
z-index: 9999;
min-width: 300px;
">
    <div style="font-weight:bold; margin-bottom:8px;">
        DIRECCIÓN DE SUPERVISIÓN DE PROYECTOS
    </div>
    <div id="popupMensaje"></div>
</div>

<!-- =========================
FONDO SVG
========================= -->
<svg class="fondoSVG" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">

  <!-- ONDA PRINCIPAL -->
  <path class="anim"
    d="M0,900 L0,350 C300,450 700,200 1440,350 L1440,900 Z"
    fill="url(#grad1)" />

  <!-- SEGUNDA CAPA AZUL -->
  <path class="anim"
    d="M0,900 L0,200 C250,300 500,150 900,250 L0,900 Z"
    fill="url(#grad2)" />

  <!-- BLANCO -->
  <path
   d="M420,0 
      C850,0 1200,150 1600,350 
      L1600,900 
      L0,900 
      C200,750 250,400 420,0 Z"
   fill="url(#grad3)"
   stroke="rgba(100,116,139,0.25)"
   stroke-width="2"
   style="filter: drop-shadow(0px 30px 60px rgba(0,0,0,0.25));"
   />

  <defs>
    <linearGradient id="grad1">
      <stop offset="0%" stop-color="#0f4c75"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="grad2">
      <stop offset="0%" stop-color="#0f4c75"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="grad3">
      <stop offset="0%" stop-color="rgba(255,255,255,0.65)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.35)"/>
   </linearGradient>
  </defs>

</svg>

<!-- =========================
PARTÍCULAS
========================= -->
<canvas id="particles"></canvas>

<!-- =========================
CONTENIDO
========================= -->
<div class="contenedor">

    <img src="/static/landing/Logotipo_ATU.svg" class="logo">

    <div class="texto">
        <div class="titulo">
            AUTORIDAD DE TRANSPORTE URBANO PARA LIMA Y CALLAO
        </div>

        <div class="subtitulo">
            DIRECCIÓN DE SUPERVISIÓN DE PROYECTOS
        </div>
    </div>

</div>

<!-- =========================
LOGIN FLOTANTE
========================= -->
<form id="loginForm" class="login">

    <input id="email" class="input" placeholder="Correo">

    <div style="position:relative; margin-bottom:10px;">

      <input id="password"
      type="password"
      placeholder="Contraseña"
      class="input"
      autocomplete="new-password"
      style="padding-right:50px;">

      <button type="button"
      id="togglePassword"
      style="
      position:absolute;
      right:5px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      cursor:pointer;
      z-index:9999;
      font-size:16px;
      ">
         👁️
      </button>

   </div>

    <button type="submit" class="btn w-full">Ingresar</button>

    <div id="mensaje" style="color:red; margin-top:10px;"></div>

</form>

<!-- =========================
BOTONES
========================= -->
<div class="botones">
   <button onclick="irDashboard()" class="btn">Dashboard</button>
   <button onclick="irReportes()" class="btn">Reportes</button>
</div>

<!-- =========================
SCRIPT PARTÍCULAS
========================= -->
<script>

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<60;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
vx:Math.random()*1-0.5,
vy:Math.random()*1-0.5
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;

ctx.beginPath();
ctx.arc(p.x,p.y,2,0,Math.PI*2);
ctx.fillStyle="rgba(255,255,255,0.6)";
ctx.fill();
});

requestAnimationFrame(draw);
}

draw();


function irDashboard(){
    window.location.href = "/dashboard";
}

function irReportes(){
    window.location.href = "https://atugobpe.sharepoint.com/sites/DOCUMENTOSEXTERNOSDSP/";
}

</script>

<script src="/static/landing/landing.js"></script>

</body>
</html>
